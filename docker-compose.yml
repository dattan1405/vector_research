services:
  # ==========================================
  # 1. PostgreSQL + pgvector (Relational + Vector)
  # ==========================================
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector_test_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: vector_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vector_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Qdrant (Pure Vector DB in Rust)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_test_db
    restart: always
    ports:
      - "6333:6333"   # REST API & Web UI Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true

  # ==========================================
  # 3. Milvus Standalone (Distributed Vector DB)
  # ==========================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.14
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd

  minio:
    container_name: milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # MinIO Web Console
      - "9000:9000"   # MinIO S3 API
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.4
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530" # Milvus RPC Port
      - "9091:9091"   # Milvus Health/Metrics Port
    depends_on:
      - etcd
      - minio

volumes:
  pgvector_data:
  qdrant_data:
  etcd_data:
  minio_data:
  milvus_data: